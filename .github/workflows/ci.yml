name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y sdcc gcc g++ clang cmake libpng-dev ninja-build

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-${{ hashFiles('scripts/install_tools.py') }}

      - name: Install tools
        run: python3 scripts/install_tools.py

      - name: Configure
        run: python3 configure.py

      - name: Build ROM
        run: ninja

      - name: Build libsameboy
        run: ninja build/lib/libsameboy.so

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: |
          uv run pytest
