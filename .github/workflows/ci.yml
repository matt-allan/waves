name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y sdcc gcc g++ clang cmake libpng-dev ninja-build

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: tools
          key: tools-${{ hashFiles('scripts/install_tools.py') }}

      - name: Install tools
        run: python3 scripts/install_tools.py

      - name: Configure
        run: python3 configure.py

      - name: Build ROM
        run: ninja

      - name: Build and run tests
        run: ninja build/lib/libsameboy.so && PYTHONPATH=src WAVES_ROM=build/waves.gb python3 test/test_emulator_py.py
