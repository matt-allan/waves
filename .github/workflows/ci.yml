name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y sdcc gcc g++ clang cmake libpng-dev

      - name: Get submodule SHAs
        id: submodule-shas
        run: |
          echo "toolchain=$(git rev-parse HEAD:vendor/gbdk-2020)-$(git rev-parse HEAD:vendor/cppp)" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            build/gbdk
            vendor/cppp/cppp
          key: toolchain-${{ steps.submodule-shas.outputs.toolchain }}

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: ./scripts/build-toolchain.sh

      - name: Build ROM
        run: make

      - name: Build and run tests
        run: make test
