[project]
name = "waves"
version = "0.1.0"
description = "Waves dev tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.38.3",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = [
  "src",
  "tests"
]
executionEnvironments = [
  { root = "tests", reportPrivateUsage = false },
  { root = "src" }
]
reportAny = false
reportUnannotatedClassAttribute = false
reportUnusedCallResult = false
