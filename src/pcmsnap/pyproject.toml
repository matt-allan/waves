[project]
name = "pcmsnap"
version = "0.1.0"
description = "Snapshot testing for Game Boy synth audio output"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcmsnap"]
